/* ═══════════════ HOOKS ═══════════════ */
function useTyping(text,speed=13){
  const [d,setD]=useState("");const [done,setDone]=useState(false);
  useEffect(()=>{
    if(!text){setD("");setDone(false);return;}
    setD("");setDone(false);let i=0;
    const t=setInterval(()=>{i++;setD(text.slice(0,i));if(i>=text.length){clearInterval(t);setDone(true);}},speed);
    return()=>clearInterval(t);
  },[text]);
  return{displayed:d,done};
}

/* ═══════════════ PARTICLES ═══════════════ */
const Particles=()=>{
  const ref=useRef(null);
  useEffect(()=>{
    const c=ref.current;if(!c)return;
    const ctx=c.getContext("2d");
    let W=c.width=window.innerWidth,H=c.height=window.innerHeight;
    window.addEventListener("resize",()=>{W=c.width=window.innerWidth;H=c.height=window.innerHeight;});
    const pts=Array.from({length:55},()=>({
      x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28,
      r:Math.random()*1.6+.3,
      color:Math.random()>.5?"rgba(0,212,255,":"rgba(124,58,237,",
    }));
    let raf;
    const draw=()=>{
      ctx.clearRect(0,0,W,H);
      pts.forEach(p=>{
        p.x+=p.vx;p.y+=p.vy;
        if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=p.color+".28)";ctx.fill();
      });
      pts.forEach((a,i)=>pts.slice(i+1).forEach(b=>{
        const d=Math.hypot(a.x-b.x,a.y-b.y);
        if(d<130){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=`rgba(0,212,255,${.05*(1-d/130)})`;ctx.lineWidth=.7;ctx.stroke();}
      }));
      raf=requestAnimationFrame(draw);
    };
    draw();
    return()=>cancelAnimationFrame(raf);
  },[]);
  return <canvas ref={ref} style={{position:"fixed",inset:0,zIndex:0,pointerEvents:"none"}}/>;
};

/* ═══════════════ GEAR ═══════════════ */
const Gear=({size=60,speed=14,opacity=.07,reverse=false,color="#00d4ff"})=>{
  const teeth=12,r=size/2,ri=r*.65,rt=r*.86,pts=[];
  for(let i=0;i<teeth;i++){const a=(i/teeth)*Math.PI*2,aw=Math.PI/teeth*.5;
    pts.push(`${rt*Math.cos(a-aw)},${rt*Math.sin(a-aw)}`);
    pts.push(`${r*Math.cos(a-aw*.3)},${r*Math.sin(a-aw*.3)}`);
    pts.push(`${r*Math.cos(a+aw*.3)},${r*Math.sin(a+aw*.3)}`);
    pts.push(`${rt*Math.cos(a+aw)},${rt*Math.sin(a+aw)}`);
  }
  return <svg width={size*2} height={size*2} viewBox={`${-size} ${-size} ${size*2} ${size*2}`} style={{animation:`${reverse?"spinR":"spin"} ${speed}s linear infinite`,display:"block"}}>
    <polygon points={pts.join(" ")} fill="none" stroke={color} strokeWidth="1.5" opacity={opacity}/>
    <circle r={ri} fill="none" stroke={color} strokeWidth="1" opacity={opacity*.8}/>
    <circle r={r*.18} fill={color} opacity={opacity*.6}/>
  </svg>;
};

/* ═══════════════ MAP ═══════════════ */
const MapComp=({lat,lng,onPick,readonly=false,markers=[]})=>{
  const ref=useRef(null),inst=useRef(null),mark=useRef(null);
  useEffect(()=>{
    if(!window.L||!ref.current)return;
    const L=window.L;
    if(inst.current){inst.current.remove();inst.current=null;}
    const map=L.map(ref.current).setView([lat||35.6892,lng||51.389],lat?14:10);
    inst.current=map;
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OSM"}).addTo(map);
    const mkIcon=(c)=>L.divIcon({className:"",html:`<div style="width:28px;height:28px;background:${c};border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2.5px solid white;box-shadow:0 4px 12px ${c}80"></div>`,iconSize:[28,28],iconAnchor:[14,28]});
    if(lat&&lng)mark.current=L.marker([lat,lng],{icon:mkIcon("linear-gradient(135deg,#00d4ff,#7c3aed)")}).addTo(map);
    markers.forEach(m=>L.marker([m.lat,m.lng],{icon:mkIcon("linear-gradient(135deg,#f97316,#ef4444)")}).addTo(map).bindPopup(`<b style="font-family:Tahoma">${m.name}</b><br/><small style="font-family:Tahoma">${m.city}</small>`));
    if(!readonly)map.on("click",e=>{const{lat:la,lng:ln}=e.latlng;if(mark.current)map.removeLayer(mark.current);mark.current=L.marker([la,ln],{icon:mkIcon("linear-gradient(135deg,#00d4ff,#7c3aed)")}).addTo(map);onPick&&onPick(la,ln);});
    return()=>{inst.current&&inst.current.remove();inst.current=null;};
  },[lat,lng,readonly,markers.length]);
  return <div ref={ref} style={{width:"100%",height:"100%",borderRadius:16}}/>;
};

  const dist=(a,b,c,d)=>{const R=6371,dL=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dl/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));};
  const doFind=()=>{let r=[...shops];if(findCity)r=r.filter(s=>s.city===findCity);if(findCat)r=r.filter(s=>s.services.includes(findCat));if(uLat&&uLng)r=r.map(s=>({...s,dist:s.lat&&s.lng?dist(uLat,uLng,s.lat,s.lng):null})).sort((a,b)=>(a.dist||999)-(b.dist||999));setFindResults(r);};
  const getLoc=()=>{setLocLoad(true);navigator.geolocation.getCurrentPosition(p=>{setULat(p.coords.latitude);setULng(p.coords.longitude);setLocLoad(false);setToast("✓ موقعیت دریافت شد");},()=>{setLocLoad(false);setToast("❌ دسترسی رد شد");});};
  const submitShop=()=>{if(!form.name||!form.phone||!form.city)return;setSaving(true);setTimeout(()=>{saveShops([...shops,{...form,id:Date.now()}]);setSaving(false);setRegStep(3);setToast("🎉 ثبت شد!");},700);};
  const submitReview=()=>{if(!revForm.name||!revForm.text)return;const u=[{...revForm,date:"همین الان",avatar:"👤"},...reviews];setReviews(u);db.set("taamiryar_reviews",u);setShowReview(false);setRevForm({name:"",city:"",text:"",rating:5});setToast("💛 نظر ثبت شد!");};

  const TABS=[
    {id:"home",icon:"⬡",label:"خانه"},
    {id:"diagnose",icon:"🤖",label:"تشخیص AI"},
    {id:"find",icon:"📍",label:"تعمیرگاه"},
    {id:"register",icon:"＋",label:"ثبت‌نام"},
  ];

        {/* Top row */}
        <div style={{display:"flex",alignItems:"center",gap:14,padding:"12px 20px 10px"}}>
          {/* Logo */}
          <div style={{display:"flex",alignItems:"center",gap:10,flexShrink:0,cursor:"pointer"}} onClick={()=>setTab("home")}>
            <div style={{width:40,height:40,borderRadius:12,background:"linear-gradient(135deg,#00d4ff,#7c3aed)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,animation:"glow 3s ease-in-out infinite",flexShrink:0}}>🔧</div>
            <div>
              <div style={{fontSize:18,fontWeight:900,letterSpacing:-.5,...gradText,lineHeight:1}}>تعمیریار</div>

            </div>
          </div>
          {/* AI Search bar in header */}
          <AISearchBar onSearch={q=>diagnose(q)}/>

          <button onClick={()=>setShowTip(true)} style={{background:"transparent",border:"1.5px solid rgba(0,212,255,.2)",color:"#00d4ff",borderRadius:20,padding:"8px 14px",fontFamily:"inherit",fontSize:12,cursor:"pointer",fontWeight:600,flexShrink:0,transition:"all .2s",whiteSpace:"nowrap"}} onMouseEnter={e=>e.currentTarget.style.background="rgba(0,212,255,.08)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>💛 حمایت</button>
        </div>
        {/* Stats bar */}

            {shops.length>0&&(

                  <div key={s.id} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 0",borderBottom:"1px solid rgba(30,45,69,.6)"}}>
                    <div style={{width:40,height:40,borderRadius:12,background:"linear-gradient(135deg,rgba(0,212,255,.1),rgba(124,58,237,.1))",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>🔧</div>

                      <div style={{fontSize:14,fontWeight:700,color:"#e2e8f0",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.name}</div>

                    </div>
                    <a href={`tel:${s.phone}`} style={{fontSize:12,color:"#00d4ff",background:"rgba(0,212,255,.08)",border:"1px solid rgba(0,212,255,.2)",borderRadius:10,padding:"7px 12px",fontWeight:600,flexShrink:0}}>📞 تماس</a>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* ════ DIAGNOSE ════ */}
        {tab==="diagnose"&&(
          <div style={{animation:"fadeUp .4s ease"}}>
            <div style={{marginBottom:22}}>
              <h2 style={{fontSize:22,fontWeight:900,marginBottom:6,...gradText}}>🤖 تشخیص هوشمند</h2>
              <p style={{color:"#64748b",fontSize:14}}>دستگاه را انتخاب کن یا مستقیم بنویس</p>
            </div>

            {diagPhase==="idle"&&(<>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(88px,1fr))",gap:9,marginBottom:18}}>
                {CATS.map(c=>(
                  <button key={c.label} onClick={()=>setSelCat(selCat?.label===c.label?null:c)}
                    style={{background:selCat?.label===c.label?`${c.color}18`:`${c.color}08`,border:`1.5px solid ${selCat?.label===c.label?`${c.color}55`:`${c.color}20`}`,borderRadius:14,padding:"13px 6px",cursor:"pointer",textAlign:"center",transition:"all .2s",display:"flex",flexDirection:"column",alignItems:"center",gap:6,boxShadow:selCat?.label===c.label?`0 0 16px ${c.color}25`:"none"}}
                    onMouseEnter={e=>{if(selCat?.label!==c.label){e.currentTarget.style.background=`${c.color}15`;e.currentTarget.style.transform="translateY(-2px)";}}}
                    onMouseLeave={e=>{if(selCat?.label!==c.label){e.currentTarget.style.background=`${c.color}08`;e.currentTarget.style.transform="none";}}}
                  >

                <Sel label="🔧 نوع خدمات" value={findCat} onChange={setFindCat} options={CATS.map(c=>`${c.icon} ${c.label}`)}/>
              </div>
              <div style={{display:"flex",gap:10}}>
                <button className="btn-primary" style={{flex:1}} onClick={doFind}>🔍 جستجو</button>
                <button className="btn-secondary" style={{padding:"12px 18px",fontSize:13,whiteSpace:"nowrap"}} onClick={getLoc}>{locLoad?"...":"📡 موقعیت من"}</button>
              </div>
              {uLat&&<div style={{fontSize:12,color:"#10b981",marginTop:10,textAlign:"center",background:"rgba(16,185,129,.06)",border:"1px solid rgba(16,185,129,.15)",borderRadius:10,padding:"8px"}}>✓ موقعیت دریافت شد — مرتب‌سازی بر اساس فاصله</div>}
            </div>

            {findResults===null&&shops.length===0&&(
              <div style={{textAlign:"center",padding:"60px 20px"}}>
                <div style={{fontSize:56,marginBottom:14,animation:"float 3s ease-in-out infinite"}}>🏪</div>
                <div style={{fontSize:15,color:"#64748b",marginBottom:20}}>هنوز تعمیرگاهی ثبت نشده</div>
                <button className="btn-primary" onClick={()=>setTab("register")}>✏️ اولین ثبت‌نام</button>
              </div>
            )}

            {findResults!==null&&findResults.length===0&&(
              <div style={{textAlign:"center",padding:"60px 20px"}}>
                <div style={{fontSize:56,marginBottom:14}}>😕</div>
                <div style={{color:"#64748b",fontSize:14}}>تعمیرگاهی با این مشخصات پیدا نشد</div>
              </div>
            )}

            {((findResults!==null&&findResults.length>0)||(findResults===null&&shops.length>0))&&(<>
              <div style={{height:250,borderRadius:18,overflow:"hidden",marginBottom:18,border:"1.5px solid rgba(0,212,255,.15)"}}>
                <MapComp lat={uLat||35.6892} lng={uLng||51.389} readonly markers={(findResults||shops).filter(s=>s.lat&&s.lng).map(s=>({lat:s.lat,lng:s.lng,name:s.name,city:s.city}))}/>
              </div>
              <div style={{fontSize:12,color:"#00d4ff",marginBottom:12,fontWeight:600}}>{(findResults||shops).length} تعمیرگاه یافت شد</div>
              {(findResults||shops).map(s=>(
                <div key={s.id} className="card" style={{marginBottom:12,padding:18}}>
                  <div style={{display:"flex",alignItems:"flex-start",gap:14}}>
                    <div style={{width:50,height:50,borderRadius:14,background:"linear-gradient(135deg,rgba(0,212,255,.1),rgba(124,58,237,.1))",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,flexShrink:0}}>🔧</div>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:5}}>
                        <span style={{fontSize:15,fontWeight:700,color:"#e2e8f0"}}>{s.name}</span>
                        {s.dist!=null&&<Badge color="#00d4ff">{s.dist<1?`${(s.dist*1000).toFixed(0)}m`:`${s.dist.toFixed(1)}km`}</Badge>}
                      </div>
                      {s.owner&&<div style={{fontSize:12,color:"#64748b",marginBottom:4}}>👤 {s.owner}</div>}
                      <div style={{fontSize:12,color:"#475569",marginBottom:10}}>📍 {s.city}{s.address?` — ${s.address}`:""}</div>
                      <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:10}}>
                        {s.services.slice(0,5).map(sv=><span key={sv} className="tag">{sv}</span>)}
                        {s.services.length>5&&<span style={{fontSize:11,color:"#00d4ff"}}>+{s.services.length-5}</span>}
                      </div>
                      {s.desc&&<div style={{fontSize:12,color:"#475569",marginBottom:12,lineHeight:1.7,background:"rgba(255,255,255,.02)",borderRadius:10,padding:"8px 12px"}}>{s.desc}</div>}
                      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                        {s.phone&&<a href={`tel:${s.phone}`} style={{fontSize:12,color:"#00d4ff",background:"rgba(0,212,255,.07)",border:"1px solid rgba(0,212,255,.2)",borderRadius:10,padding:"7px 14px",fontWeight:700,display:"flex",alignItems:"center",gap:5}}>📞 {s.phone}</a>}
                        {s.telegram&&<a href={`https://t.me/${s.telegram}`} target="_blank" style={{fontSize:12,color:"#818cf8",background:"rgba(99,102,241,.07)",border:"1px solid rgba(99,102,241,.2)",borderRadius:10,padding:"7px 12px",fontWeight:600}}>✈️ تلگرام</a>}
                        {s.instagram&&<a href={`https://instagram.com/${s.instagram}`} target="_blank" style={{fontSize:12,color:"#ec4899",background:"rgba(236,72,153,.07)",border:"1px solid rgba(236,72,153,.2)",borderRadius:10,padding:"7px 12px",fontWeight:600}}>📸 اینستا</a>}
                      </div>
                    </div>
                  </div>
                </div>
              ))}
            </>)}
          </div>
        )}

        {/* ════ REGISTER ════ */}
        {tab==="register"&&(
          <div style={{animation:"fadeUp .4s ease"}}>
            <div style={{marginBottom:22}}>
              <h2 style={{fontSize:22,fontWeight:900,marginBottom:6,...gradText}}>✏️ ثبت تعمیرگاه</h2>
              <p style={{color:"#64748b",fontSize:14}}>رایگان — در taamiryar.com دیده بشو</p>
            </div>

            {regStep===3?(
              <div style={{textAlign:"center",padding:"50px 20px",animation:"fadeUp .5s ease"}}>
                <div style={{fontSize:72,marginBottom:20,animation:"float 3s ease-in-out infinite"}}>🎉</div>
                <div style={{fontSize:24,fontWeight:900,marginBottom:10,...gradText}}>ثبت شد!</div>
                <div style={{color:"#64748b",fontSize:14,marginBottom:28,lineHeight:2}}>
                  <strong style={{color:"#e2e8f0"}}>{form.name}</strong> در taamiryar.com ثبت شد
                </div>
                <div style={{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap"}}>
                  <button className="btn-secondary" onClick={()=>{setRegStep(0);setForm({name:"",owner:"",phone:"",telegram:"",instagram:"",city:"",address:"",services:[],lat:null,lng:null,desc:""});}}>ثبت دیگری</button>
                  <button className="btn-primary" onClick={()=>setTab("find")}>مشاهده در نقشه</button>
                </div>
              </div>
            ):(
              <>
                <div style={{display:"flex",gap:6,marginBottom:26}}>
                  {["اطلاعات","خدمات","موقعیت"].map((l,i)=>(
                    <div key={i} style={{flex:1}}>
                      <div style={{height:3,borderRadius:2,background:i<=regStep?"linear-gradient(90deg,#00d4ff,#7c3aed)":"rgba(30,45,69,.8)",transition:"all .4s"}}/>
                      <div style={{fontSize:11,color:i===regStep?"#00d4ff":i<regStep?"#64748b":"#1e3a4a",marginTop:6,textAlign:"center",fontWeight:i===regStep?700:400}}>{l}</div>
                    </div>
                  ))}
                </div>

                {regStep===0&&<div className="card">
                  <Field label="🏪 نام تعمیرگاه *" value={form.name} onChange={ff("name")} placeholder="تعمیرگاه رضایی"/>
                  <Field label="👤 نام صاحب" value={form.owner} onChange={ff("owner")} placeholder="علی رضایی"/>
                  <Field label="📞 شماره تماس *" value={form.phone} onChange={ff("phone")} placeholder="09121234567" type="tel"/>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                    <Field label="✈️ تلگرام" value={form.telegram} onChange={ff("telegram")} placeholder="username"/>
                    <Field label="📸 اینستاگرام" value={form.instagram} onChange={ff("instagram")} placeholder="username"/>
                  </div>
                  <Sel label="🏙️ شهر *" value={form.city} onChange={ff("city")} options={CITIES}/>
                  <Field label="📍 آدرس" value={form.address} onChange={ff("address")} placeholder="خیابان، کوچه، پلاک..." multiline/>
                  <button className="btn-primary" style={{width:"100%",padding:"14px"}} onClick={()=>{if(form.name&&form.phone&&form.city)setRegStep(1);}} disabled={!form.name||!form.phone||!form.city}>مرحله بعد ←</button>
                </div>}

                {regStep===1&&<div className="card">
                  <div style={{fontSize:14,fontWeight:700,color:"#e2e8f0",marginBottom:16}}>🔧 خدمات ارائه شده *</div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8,marginBottom:18}}>
                    {CATS.map(c=>{const k=`${c.icon} ${c.label}`;const sel=form.services.includes(k);return(
                      <button key={k} onClick={()=>tog(k)} style={{background:sel?`${c.color}12`:"rgba(255,255,255,.02)",border:`1.5px solid ${sel?`${c.color}45`:"rgba(30,45,69,.8)"}`,color:sel?c.color:"#64748b",borderRadius:12,padding:"11px 10px",fontFamily:"inherit",cursor:"pointer",transition:"all .2s",display:"flex",alignItems:"center",gap:8,fontSize:12,boxShadow:sel?`0 0 12px ${c.color}20`:"none"}}>
                        <span style={{fontSize:18}}>{c.icon}</span><span>{c.label}</span>
                      </button>
                    );})}
                  </div>
                  <Field label="📝 توضیحات" value={form.desc} onChange={ff("desc")} placeholder="سابقه کار، گارانتی، خدمات ویژه..." multiline/>
                  <div style={{display:"flex",gap:10}}>
                    <button className="btn-secondary" style={{padding:"12px 18px"}} onClick={()=>setRegStep(0)}>→ قبلی</button>
                    <button className="btn-primary" style={{flex:1,padding:"12px"}} onClick={()=>{if(form.services.length>0)setRegStep(2);}} disabled={!form.services.length}>مرحله بعد ←</button>
                  </div>
                </div>}

                {regStep===2&&<div className="card">
                  <div style={{fontSize:14,fontWeight:700,color:"#e2e8f0",marginBottom:8}}>🗺️ موقعیت روی نقشه</div>
                  <div style={{fontSize:13,color:"#64748b",marginBottom:14,lineHeight:1.7}}>روی نقشه کلیک کن تا موقعیت دقیق مشخص بشه (اختیاری)</div>
                  <div style={{height:280,borderRadius:16,overflow:"hidden",marginBottom:14,border:"1.5px solid rgba(0,212,255,.15)"}}>
                    <MapComp lat={form.lat||35.6892} lng={form.lng||51.389} onPick={(la,ln)=>setForm(p=>({...p,lat:la,lng:ln}))}/>
                  </div>
                  {form.lat&&<div style={{fontSize:12,color:"#10b981",marginBottom:14,textAlign:"center",background:"rgba(16,185,129,.06)",border:"1px solid rgba(16,185,129,.2)",borderRadius:10,padding:"9px"}}>✓ موقعیت انتخاب شد</div>}
                  <div style={{display:"flex",gap:10}}>
                    <button className="btn-secondary" style={{padding:"12px 18px"}} onClick={()=>setRegStep(1)}>→ قبلی</button>
                    <button className="btn-primary" style={{flex:1,padding:"12px"}} onClick={submitShop} disabled={saving}>{saving?"در حال ثبت...":"✓ ثبت رایگان"}</button>
                  </div>
                </div>}
              </>
            )}
          </div>
        )}
      </main>

      {/* ═══ REVIEW MODAL ═══ */}
      {showReview&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.9)",backdropFilter:"blur(20px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:20,animation:"fadeIn .2s ease"}} onClick={()=>setShowReview(false)}>
          <div onClick={e=>e.stopPropagation()} style={{background:"var(--surface)",border:"1.5px solid rgba(0,212,255,.15)",borderRadius:24,padding:"28px 24px",width:"100%",maxWidth:400,animation:"slideUp .3s ease",boxShadow:"0 40px 80px #000"}}>
            <div style={{fontSize:30,textAlign:"center",marginBottom:12}}>💬</div>
            <div style={{fontSize:18,fontWeight:900,textAlign:"center",marginBottom:20,...gradText}}>نظرت رو بنویس</div>
            <Field label="نام شما *" value={revForm.name} onChange={v=>setRevForm(p=>({...p,name:v}))} placeholder="علی محمدی"/>
            <Sel label="شهر" value={revForm.city} onChange={v=>setRevForm(p=>({...p,city:v}))} options={CITIES}/>
            <div style={{marginBottom:16}}>
              <label className="label">امتیاز</label>
              <Stars n={revForm.rating} size={28} onChange={n=>setRevForm(p=>({...p,rating:n}))}/>
            </div>
            <Field label="نظر *" value={revForm.text} onChange={v=>setRevForm(p=>({...p,text:v}))} placeholder="تجربه‌ات رو بنویس..." multiline/>
            <div style={{display:"flex",gap:10}}>
              <button className="btn-primary" style={{flex:1,padding:"13px"}} onClick={submitReview} disabled={!revForm.name||!revForm.text}>ثبت نظر</button>
              <button className="btn-secondary" style={{padding:"13px 18px"}} onClick={()=>setShowReview(false)}>✕</button>
            </div>
          </div>
        </div>
      )}

      {/* ═══ TIP MODAL (ریالی) ═══ */}
      {showTip&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.9)",backdropFilter:"blur(20px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:20,animation:"fadeIn .2s ease"}} onClick={()=>setShowTip(false)}>
          <div onClick={e=>e.stopPropagation()} style={{background:"var(--surface)",border:"1.5px solid rgba(0,212,255,.15)",borderRadius:24,padding:"30px 24px",width:"100%",maxWidth:380,textAlign:"center",animation:"slideUp .3s ease",boxShadow:"0 40px 80px #000",position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",top:-60,left:"50%",transform:"translateX(-50%)",width:250,height:130,background:"radial-gradient(ellipse,rgba(0,212,255,.1) 0%,transparent 70%)",pointerEvents:"none"}}/>
            <div style={{fontSize:42,marginBottom:12}}>💛</div>
            <div style={{fontSize:20,fontWeight:900,marginBottom:8,...gradText}}>حمایت مالی</div>
            <div style={{color:"#64748b",fontSize:13,marginBottom:22,lineHeight:1.9}}>
              تعمیریار رایگانه.<br/>
              با حمایتت کمک کن بهترش کنیم 🙏
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:20}}>
              {TIP_AMOUNTS.map(t=>(
                <button key={t.amount} onClick={()=>setTipAmt(t)} style={{background:tipAmt?.amount===t.amount?"linear-gradient(135deg,rgba(0,212,255,.15),rgba(124,58,237,.15))":"rgba(255,255,255,.03)",border:`1.5px solid ${tipAmt?.amount===t.amount?"rgba(0,212,255,.45)":"rgba(30,45,69,.8)"}`,color:tipAmt?.amount===t.amount?"#00d4ff":"#64748b",borderRadius:16,padding:"16px 8px",fontFamily:"inherit",cursor:"pointer",transition:"all .2s",boxShadow:tipAmt?.amount===t.amount?"0 0 20px rgba(0,212,255,.2)":"none"}}>
                  <div style={{fontSize:24,marginBottom:5}}>{t.icon}</div>
                  <div style={{fontSize:15,fontWeight:800}}>{t.label} تومان</div>
                  <div style={{fontSize:10,opacity:.6,marginTop:3}}>{t.desc}</div>
                </button>
              ))}
            </div>
            <div style={{background:"rgba(245,158,11,.06)",border:"1px solid rgba(245,158,11,.15)",borderRadius:12,padding:"12px",marginBottom:18,fontSize:12,color:"#92400e",lineHeight:1.7}}>
              💳 درگاه پرداخت ریالی<br/>
              <span style={{color:"#a16207"}}>زرین‌پال · سامان‌کیش · به زودی فعال می‌شه</span>
            </div>
            <div style={{display:"flex",gap:10}}>
              <button className="btn-primary" style={{flex:1,padding:"13px",opacity:tipAmt?1:.5,cursor:tipAmt?"pointer":"default"}} onClick={()=>{if(tipAmt){setToast(`💛 ممنون از حمایت ${tipAmt.label} تومانیت!`);setShowTip(false);setTipAmt(null);}}}>
                {tipAmt?`💛 ${tipAmt.label} تومان حمایت`:"ابتدا مبلغ انتخاب کن"}
              </button>
              <button className="btn-secondary" style={{padding:"13px 16px"}} onClick={()=>setShowTip(false)}>✕</button>
            </div>
          </div>
        </div>
      )}

      {toast&&<Toast msg={toast}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
