function useTyping(text,speed=14){
  const [d,setD]=useState("");const [done,setDone]=useState(false);
  useEffect(()=>{
    if(!text){setD("");setDone(false);return;}
    setD("");setDone(false);let i=0;
    const t=setInterval(()=>{i++;setD(text.slice(0,i));if(i>=text.length){clearInterval(t);setDone(true);}},speed);
    return()=>clearInterval(t);
  },[text]);
  return{displayed:d,done};
}

// Particles
const Particles=()=>{
  const ref=useRef(null);
  useEffect(()=>{
    const c=ref.current;if(!c)return;
    const ctx=c.getContext("2d");
    let W=c.width=window.innerWidth,H=c.height=window.innerHeight;
    const onR=()=>{W=c.width=window.innerWidth;H=c.height=window.innerHeight;};
    window.addEventListener("resize",onR);
    const pts=Array.from({length:40},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.5+.4}));
    let raf;
    const draw=()=>{
      ctx.clearRect(0,0,W,H);
      pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle="rgba(56,189,248,.22)";ctx.fill();});
      pts.forEach((a,i)=>pts.slice(i+1).forEach(b=>{const d=Math.hypot(a.x-b.x,a.y-b.y);if(d<120){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=`rgba(56,189,248,${.05*(1-d/120)})`;ctx.lineWidth=.6;ctx.stroke();}}));
      raf=requestAnimationFrame(draw);
    };
    draw();
    return()=>{cancelAnimationFrame(raf);window.removeEventListener("resize",onR);};
  },[]);
  return <canvas ref={ref} style={{position:"fixed",inset:0,zIndex:0,pointerEvents:"none"}}/>;
};

const Gear=({size=60,speed=12,opacity=.07,reverse=false})=>{
  const teeth=10,r=size/2,ri=r*.68,rt=r*.88,pts=[];
  for(let i=0;i<teeth;i++){const a=(i/teeth)*Math.PI*2,aw=Math.PI/teeth*.55;pts.push(`${rt*Math.cos(a-aw)},${rt*Math.sin(a-aw)}`);pts.push(`${r*Math.cos(a-aw*.3)},${r*Math.sin(a-aw*.3)}`);pts.push(`${r*Math.cos(a+aw*.3)},${r*Math.sin(a+aw*.3)}`);pts.push(`${rt*Math.cos(a+aw)},${rt*Math.sin(a+aw)}`);}
  return <svg width={size*2} height={size*2} viewBox={`${-size} ${-size} ${size*2} ${size*2}`} style={{animation:`${reverse?"spinR":"spin"} ${speed}s linear infinite`,display:"block"}}><polygon points={pts.join(" ")} fill="none" stroke="#38bdf8" strokeWidth="1.5" opacity={opacity}/><circle r={ri} fill="none" stroke="#38bdf8" strokeWidth="1" opacity={opacity}/><circle r={r*.2} fill="#38bdf8" opacity={opacity*.8}/></svg>;
};

const MapComp=({lat,lng,onPick,readonly,markers=[]})=>{
  const ref=useRef(null),inst=useRef(null),mark=useRef(null);
  useEffect(()=>{
    if(!window.L||!ref.current)return;
    const L=window.L;
    if(inst.current){inst.current.remove();inst.current=null;}
    const map=L.map(ref.current).setView([lat||35.6892,lng||51.389],lat?14:10);
    inst.current=map;
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OSM",maxZoom:19}).addTo(map);
    const mkIcon=(c1,c2)=>L.divIcon({className:"",html:`<div style="width:28px;height:28px;background:linear-gradient(135deg,${c1},${c2});border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid white;box-shadow:0 3px 10px ${c1}80"></div>`,iconSize:[28,28],iconAnchor:[14,28]});
    if(lat&&lng)mark.current=L.marker([lat,lng],{icon:mkIcon("#0ea5e9","#6366f1")}).addTo(map);
    markers.forEach(m=>L.marker([m.lat,m.lng],{icon:mkIcon("#f59e0b","#ef4444")}).addTo(map).bindPopup(`<b style="font-family:Tahoma">${m.name}</b><br/><span style="font-family:Tahoma">${m.city}</span>`));
    if(!readonly)map.on("click",e=>{const{lat:la,lng:ln}=e.latlng;if(mark.current)map.removeLayer(mark.current);mark.current=L.marker([la,ln],{icon:mkIcon("#0ea5e9","#6366f1")}).addTo(map);onPick&&onPick(la,ln);});
    return()=>{if(inst.current){inst.current.remove();inst.current=null;}};
  },[lat,lng,readonly,markers.length]);
  return <div ref={ref} style={{width:"100%",height:"100%",borderRadius:14}}/>;
};

  const [selCat,setSelCat]=useState(null);
  const [diagPhase,setDiagPhase]=useState("idle");
  const [diagResult,setDiagResult]=useState("");
  const [dots,setDots]=useState(0);
  const {displayed,done}=useTyping(diagResult);
  const [form,setForm]=useState({name:"",owner:"",phone:"",telegram:"",instagram:"",city:"",address:"",services:[],lat:null,lng:null,desc:""});

  const [findCat,setFindCat]=useState("");
  const [findResults,setFindResults]=useState(null);
  const [uLat,setULat]=useState(null);
  const [uLng,setULng]=useState(null);
  const [locLoad,setLocLoad]=useState(false);
  const [showTip,setShowTip]=useState(false);
  const [tipAmt,setTipAmt]=useState("");
  const [showReview,setShowReview]=useState(false);
  const [revForm,setRevForm]=useState({name:"",city:"",text:"",rating:5});
  const [toast,setToast]=useState(null);
  const [mounted,setMounted]=useState(false);

  useEffect(()=>{setTimeout(()=>setMounted(true),100);},[]);
  useEffect(()=>{if(toast){const t=setTimeout(()=>setToast(null),3000);return()=>clearTimeout(t);}},[toast]);
  useEffect(()=>{if(diagPhase!=="loading")return;const t=setInterval(()=>setDots(d=>(d+1)%4),380);return()=>clearInterval(t);},[diagPhase]);

  const saveShops=s=>{setShops(s);store.set("taamiryar_shops",s);};
  const ff=k=>v=>setForm(p=>({...p,[k]:v}));
  const tog=s=>setForm(p=>({...p,services:p.services.includes(s)?p.services.filter(x=>x!==s):[...p.services,s]}));

  const diagnose=async(q=query)=>{
    const fq=(selCat?`[${selCat.icon} ${selCat.label}] `:"")+q;
    if(!fq.trim())return;
    setDiagPhase("loading");setDiagResult("");
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:`تو متخصص تعمیرات حرفه‌ای ایرانی هستی.\nمشکل کاربر: ${fq}\n\nپاسخ کوتاه و مفید به فارسی روان بده:\n\n🔍 تشخیص احتمالی: (یه جمله ساده)\n\n⚠️ دلایل رایج:\n• ...\n• ...\n\n🛠️ راه‌حل اولیه:\n۱. ...\n۲. ...\n\n💰 تخمین هزینه تعمیر:\n\n✅ توصیه نهایی:`}]})});
      const data=await res.json();
      setDiagResult(data.content?.[0]?.text||"متأسفم، خطایی رخ داد.");
    }catch{setDiagResult("❌ خطا در اتصال. لطفاً دوباره تلاش کنید.");}
    setDiagPhase("result");
  };

  const dist=(a,b,c,d)=>{const R=6371,dL=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dl/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));};

  const doFind=()=>{
    let r=[...shops];
    if(findCity)r=r.filter(s=>s.city===findCity);
    if(findCat)r=r.filter(s=>s.services.includes(findCat));
    if(uLat&&uLng)r=r.map(s=>({...s,distance:s.lat&&s.lng?dist(uLat,uLng,s.lat,s.lng):null})).sort((a,b)=>(a.distance||999)-(b.distance||999));
    setFindResults(r);
  };

  const getLoc=()=>{
    setLocLoad(true);
    navigator.geolocation.getCurrentPosition(
      p=>{setULat(p.coords.latitude);setULng(p.coords.longitude);setLocLoad(false);setToast("✓ موقعیت شما دریافت شد");},

      <div style={{position:"fixed",bottom:-100,left:-100,width:400,height:400,borderRadius:"50%",background:"radial-gradient(circle,rgba(99,102,241,.06) 0%,transparent 65%)",zIndex:0,pointerEvents:"none"}}/>
      <div style={{position:"fixed",top:70,left:-35,zIndex:1,pointerEvents:"none"}}><Gear size={70} speed={20}/></div>
      <div style={{position:"fixed",bottom:120,right:-25,zIndex:1,pointerEvents:"none"}}><Gear size={85} speed={26} reverse/></div>

      {/* HEADER */}
      <header style={{position:"sticky",top:0,zIndex:50,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 20px",borderBottom:"1px solid rgba(56,189,248,.08)",backdropFilter:"blur(24px)",background:"rgba(3,7,18,.9)"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,cursor:"pointer"}} onClick={()=>setTab("home")}>

          <div>
            <div style={{fontSize:22,fontWeight:900,letterSpacing:-.5,...grad}}>تعمیریار</div>
            <div style={{fontSize:10,color:"#1e4a6a",letterSpacing:2}}>taamiryar.com</div>
          </div>
        </div>
        <button onClick={()=>setShowTip(true)} style={{background:"transparent",border:"2px solid rgba(56,189,248,.25)",color:"#38bdf8",borderRadius:22,padding:"9px 18px",fontFamily:"Tahoma,Arial,sans-serif",fontSize:13,cursor:"pointer",fontWeight:700,transition:"all .2s",whiteSpace:"nowrap"}} onMouseEnter={e=>e.currentTarget.style.background="rgba(56,189,248,.1)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>☕ حمایت</button>
      </header>

      {/* BOTTOM NAV */}

              <>
                <div style={{display:"flex",gap:8,marginBottom:28}}>
                  {["اطلاعات","خدمات","موقعیت"].map((l,i)=>(
                    <div key={i} style={{flex:1}}>
                      <div style={{height:4,borderRadius:2,background:i<=regStep?"linear-gradient(90deg,#0ea5e9,#6366f1)":"rgba(56,189,248,.1)",transition:"all .4s"}}/>
                      <div style={{fontSize:12,color:i===regStep?"#38bdf8":i<regStep?"#64748b":"#1e3a4a",marginTop:6,textAlign:"center",fontWeight:i===regStep?700:400}}>{l}</div>
                    </div>
                  ))}
                </div>

                {regStep===0&&<Card>
                  <Field label="🏪 نام تعمیرگاه *" value={form.name} onChange={ff("name")} placeholder="مثلاً: تعمیرگاه رضایی"/>
                  <Field label="👤 نام صاحب" value={form.owner} onChange={ff("owner")} placeholder="نام و نام خانوادگی"/>
                  <Field label="📞 شماره تماس *" value={form.phone} onChange={ff("phone")} placeholder="09121234567" type="tel"/>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                    <Field label="✈️ تلگرام" value={form.telegram} onChange={ff("telegram")} placeholder="username"/>
                    <Field label="📸 اینستاگرام" value={form.instagram} onChange={ff("instagram")} placeholder="username"/>
                  </div>
                  <Sel label="🏙️ شهر *" value={form.city} onChange={ff("city")} options={CITIES}/>
                  <Field label="📍 آدرس کامل" value={form.address} onChange={ff("address")} placeholder="خیابان، کوچه، پلاک..." multiline/>
                  <BigBtn onClick={()=>{if(form.name&&form.phone&&form.city)setRegStep(1);}} full disabled={!form.name||!form.phone||!form.city}>مرحله بعد ←</BigBtn>
                </Card>}

                {regStep===1&&<Card>
                  <div style={{fontSize:15,fontWeight:700,color:"#e2e8f0",marginBottom:16}}>🔧 خدمات ارائه شده را انتخاب کنید *</div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10,marginBottom:20}}>
                    {CATS.map(c=>{
                      const key=`${c.icon} ${c.label}`;
                      const sel=form.services.includes(key);
                      return <button key={key} onClick={()=>tog(key)} style={{background:sel?"rgba(56,189,248,.12)":"rgba(255,255,255,.02)",border:`2px solid ${sel?"rgba(56,189,248,.4)":"rgba(255,255,255,.08)"}`,color:sel?"#38bdf8":"#64748b",borderRadius:12,padding:"12px 10px",fontFamily:"Tahoma,Arial,sans-serif",cursor:"pointer",transition:"all .2s",display:"flex",alignItems:"center",gap:8,fontSize:13,boxShadow:sel?"0 0 12px rgba(56,189,248,.15)":"none"}}>
                        <span style={{fontSize:20}}>{c.icon}</span><span>{c.label}</span>
                      </button>;
                    })}
                  </div>
                  <Field label="📝 توضیحات بیشتر" value={form.desc} onChange={ff("desc")} placeholder="مثلاً: ۱۵ سال سابقه، گارانتی ۶ ماهه، تعمیر در محل..." multiline/>
                  <div style={{display:"flex",gap:12}}>
                    <BigBtn secondary onClick={()=>setRegStep(0)}>→ قبلی</BigBtn>
                    <BigBtn onClick={()=>{if(form.services.length>0)setRegStep(2);}} disabled={form.services.length===0} full>مرحله بعد ←</BigBtn>
                  </div>
                </Card>}

                {regStep===2&&<Card>
                  <div style={{fontSize:15,fontWeight:700,color:"#e2e8f0",marginBottom:8}}>🗺️ موقعیت روی نقشه</div>
                  <div style={{fontSize:14,color:"#64748b",marginBottom:16,lineHeight:1.7}}>روی نقشه ضربدر بزن تا موقعیت دقیق تعمیرگاهت مشخص بشه (اختیاری)</div>
                  <div style={{height:280,borderRadius:14,overflow:"hidden",marginBottom:16,border:"2px solid rgba(56,189,248,.15)"}}>
                    <MapComp lat={form.lat||35.6892} lng={form.lng||51.389} onPick={(la,ln)=>setForm(p=>({...p,lat:la,lng:ln}))}/>
                  </div>
                  {form.lat&&<div style={{fontSize:13,color:"#10b981",marginBottom:16,textAlign:"center",background:"rgba(16,185,129,.06)",border:"1px solid rgba(16,185,129,.2)",borderRadius:10,padding:"10px"}}>✓ موقعیت انتخاب شد</div>}
                  <div style={{background:"rgba(245,158,11,.05)",border:"1px solid rgba(245,158,11,.15)",borderRadius:12,padding:"14px 16px",marginBottom:16,fontSize:13,color:"#a16207",lineHeight:1.8}}>
                    💳 <strong>درگاه پرداخت ایرانی:</strong><br/>به زودی امکان پرداخت آنلاین از طریق زرین‌پال اضافه می‌شه.
                  </div>
                  <div style={{display:"flex",gap:12}}>
                    <BigBtn secondary onClick={()=>setRegStep(1)}>→ قبلی</BigBtn>
                    <BigBtn onClick={submitShop} disabled={saving} full>{saving?"در حال ثبت...":"✓ ثبت رایگان تعمیرگاه"}</BigBtn>
                  </div>
                </Card>}
              </>
            )}
          </div>
        )}
      </main>

      {/* REVIEW MODAL */}
      {showReview&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.9)",backdropFilter:"blur(16px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:20,animation:"fadeIn .2s ease"}} onClick={()=>setShowReview(false)}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#070d1a",border:"2px solid rgba(56,189,248,.15)",borderRadius:24,padding:"28px 24px",width:"100%",maxWidth:400,animation:"slideIn .3s ease"}}>
            <div style={{fontSize:32,textAlign:"center",marginBottom:14}}>💬</div>
            <div style={{fontSize:20,fontWeight:900,textAlign:"center",marginBottom:22,...grad}}>نظرت رو بنویس</div>
            <Field label="نام شما" value={revForm.name} onChange={v=>setRevForm(p=>({...p,name:v}))} placeholder="علی محمدی"/>
            <Sel label="شهر" value={revForm.city} onChange={v=>setRevForm(p=>({...p,city:v}))} options={CITIES}/>
            <div style={{marginBottom:18}}>
              <label style={{display:"block",color:"#64748b",fontSize:14,marginBottom:10,fontWeight:600}}>امتیاز</label>
              <div style={{display:"flex",gap:8}}>
                {[1,2,3,4,5].map(n=>(
                  <button key={n} onClick={()=>setRevForm(p=>({...p,rating:n}))} style={{fontSize:32,background:"none",border:"none",cursor:"pointer",opacity:n<=revForm.rating?1:.2,transition:"all .15s",padding:"4px"}}>★</button>
                ))}
              </div>
            </div>
            <Field label="نظر شما" value={revForm.text} onChange={v=>setRevForm(p=>({...p,text:v}))} placeholder="تجربه‌ات رو بنویس..." multiline/>
            <div style={{display:"flex",gap:10}}>
              <BigBtn onClick={submitReview} disabled={!revForm.name||!revForm.text} full>ثبت نظر</BigBtn>
              <BigBtn secondary onClick={()=>setShowReview(false)} style={{padding:"14px 20px"}}>✕</BigBtn>
            </div>
          </div>
        </div>
      )}

      {/* TIP MODAL */}
      {showTip&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.9)",backdropFilter:"blur(16px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:20,animation:"fadeIn .2s ease"}} onClick={()=>setShowTip(false)}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#070d1a",border:"2px solid rgba(56,189,248,.15)",borderRadius:24,padding:"32px 26px",width:"100%",maxWidth:380,textAlign:"center",animation:"slideIn .3s ease",position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",top:-60,left:"50%",transform:"translateX(-50%)",width:250,height:130,background:"radial-gradient(ellipse,rgba(56,189,248,.1) 0%,transparent 70%)",pointerEvents:"none"}}/>
            <div style={{fontSize:44,marginBottom:14}}>☕</div>
            <div style={{fontSize:22,fontWeight:900,marginBottom:10,...grad}}>یه قهوه بریز!</div>
            <div style={{color:"#64748b",fontSize:14,marginBottom:26,lineHeight:1.9}}>تعمیریار رایگانه.<br/>با حمایتت بهترش می‌کنیم 🙏</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:22}}>
              {[{a:"$1",e:"☕",l:"یه قهوه"},{a:"$3",e:"🍕",l:"یه پیتزا"},{a:"$5",e:"🚀",l:"حامی ویژه"},{a:"$10",e:"💎",l:"قهرمان"}].map(({a,e,l})=>(
                <button key={a} onClick={()=>setTipAmt(a)} style={{background:tipAmt===a?"linear-gradient(135deg,rgba(14,165,233,.2),rgba(99,102,241,.2))":"rgba(255,255,255,.03)",border:`2px solid ${tipAmt===a?"rgba(56,189,248,.5)":"rgba(255,255,255,.06)"}`,color:tipAmt===a?"#38bdf8":"#64748b",borderRadius:16,padding:"16px 8px",fontFamily:"Tahoma,Arial,sans-serif",cursor:"pointer",transition:"all .2s",boxShadow:tipAmt===a?"0 0 20px rgba(56,189,248,.2)":"none"}}>
                  <div style={{fontSize:26,marginBottom:6}}>{e}</div>
                  <div style={{fontSize:16,fontWeight:800}}>{a}</div>
                  <div style={{fontSize:11,opacity:.6,marginTop:4}}>{l}</div>
                </button>
              ))}
            </div>
            <div style={{fontSize:11,color:"#1e3a4a",marginBottom:18}}>PayPal · Crypto · International Card</div>
            <div style={{display:"flex",gap:10}}>
              <BigBtn onClick={()=>{if(tipAmt){setToast(`💛 ممنون از حمایت ${tipAmt}ت!`);setShowTip(false);}}} disabled={!tipAmt} full>{tipAmt?`💛 ${tipAmt} حمایت کن`:"ابتدا مبلغ را انتخاب کن"}</BigBtn>
              <BigBtn secondary onClick={()=>setShowTip(false)}>✕</BigBtn>
            </div>
          </div>
        </div>
      )}

      {toast&&<Toast msg={toast}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
