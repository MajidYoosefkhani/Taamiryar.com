<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="تعمیریار — هوش مصنوعی تعمیرات ایران"/>

<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --c1:#00c6ff;--c2:#7b2ff7;--c3:#0a0f1e;
  --s1:#0d1526;--s2:#111e35;--s3:#162040;
  --b1:rgba(0,198,255,.13);--b2:rgba(123,47,247,.13);
  --t1:#e8f0ff;--t2:#8fafd4;--t3:#4a6a90;
  --g:linear-gradient(135deg,#00c6ff,#7b2ff7);
  --gr:linear-gradient(135deg,#7b2ff7,#00c6ff);
  --glow1:0 0 24px rgba(0,198,255,.25);
  --glow2:0 0 24px rgba(123,47,247,.25);
  --rad:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--c3);color:var(--t1);font-family:Tahoma,Arial,sans-serif;direction:rtl;min-height:100vh;overflow-x:hidden;font-size:15px;line-height:1.6}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--g);border-radius:3px}
::placeholder{color:var(--t3)!important}
select option{background:var(--s1)}
a{text-decoration:none;color:inherit}
button{font-family:Tahoma,Arial,sans-serif}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinR{to{transform:rotate(-360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(0,198,255,.2)}50%{box-shadow:0 0 45px rgba(0,198,255,.5),0 0 70px rgba(123,47,247,.2)}}
@keyframes ripple{0%{transform:scale(.9);opacity:.6}100%{transform:scale(2.8);opacity:0}}
@keyframes gradX{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes scanline{0%{top:-20%}100%{top:110%}}
@keyframes countUp{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}

/* Grid background */
.grid-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(0,198,255,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,198,255,.03) 1px,transparent 1px);
  background-size:44px 44px;
}
/* Glow blobs */
.blob{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(80px)}
.blob1{top:-200px;right:-150px;width:600px;height:600px;background:radial-gradient(circle,rgba(0,198,255,.07),transparent 65%)}
.blob2{bottom:-150px;left:-100px;width:500px;height:500px;background:radial-gradient(circle,rgba(123,47,247,.06),transparent 65%)}

/* Cards */
.card{background:var(--s1);border:1px solid rgba(0,198,255,.1);border-radius:var(--rad);padding:20px;backdrop-filter:blur(10px);transition:all .3s}
.card:hover{border-color:rgba(0,198,255,.22);box-shadow:0 8px 32px rgba(0,198,255,.07)}
.card-glow{border-color:rgba(0,198,255,.2);box-shadow:var(--glow1)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:12px 22px;font-family:Tahoma,Arial,sans-serif;font-weight:700;font-size:14px;cursor:pointer;transition:all .25s;white-space:nowrap}
.btn-primary{background:var(--g);color:#fff;box-shadow:0 4px 22px rgba(0,198,255,.28)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,198,255,.45)}
.btn-primary:active{transform:translateY(0)}
.btn-ghost{background:transparent;border:1.5px solid rgba(0,198,255,.22);color:var(--t2)}
.btn-ghost:hover{border-color:rgba(0,198,255,.45);color:var(--c1);background:rgba(0,198,255,.06)}
.btn-sm{padding:8px 16px;font-size:12px;border-radius:10px}
.btn-full{width:100%}
.btn-danger{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff}

/* Inputs */
.input{width:100%;background:var(--s2);border:1.5px solid rgba(0,198,255,.12);border-radius:12px;color:var(--t1);padding:12px 15px;font-size:14px;font-family:Tahoma,Arial,sans-serif;outline:none;transition:all .25s;box-sizing:border-box}
.input:focus{border-color:rgba(0,198,255,.45);box-shadow:0 0 0 3px rgba(0,198,255,.07);background:var(--s3)}
.label{display:block;color:var(--t3);font-size:11px;margin-bottom:6px;letter-spacing:.4px;font-weight:600;text-transform:uppercase}
.field{margin-bottom:15px}

/* Gradient text */
.gt{background:var(--g);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.gt2{background:var(--gr);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* Badge */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 9px;border-radius:8px;letter-spacing:.3px}
.badge-blue{background:rgba(0,198,255,.12);color:var(--c1);border:1px solid rgba(0,198,255,.2)}
.badge-purple{background:rgba(123,47,247,.12);color:#a78bfa;border:1px solid rgba(123,47,247,.2)}
.badge-green{background:rgba(16,185,129,.12);color:#34d399;border:1px solid rgba(16,185,129,.2)}
.badge-orange{background:rgba(249,115,22,.12);color:#fb923c;border:1px solid rgba(249,115,22,.2)}
.badge-red{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.2)}

/* Divider */
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(0,198,255,.15),transparent);margin:16px 0}

/* Star */
.star{color:#f59e0b;font-size:14px}
.star-off{color:rgba(245,158,11,.2)}

/* Modal overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;animation:fadeIn .2s ease}
.modal{background:var(--s1);border:1px solid rgba(0,198,255,.18);border-radius:22px;padding:28px 24px;width:100%;max-width:400px;animation:slideUp .3s ease;box-shadow:0 40px 80px rgba(0,0,0,.6)}

/* Toast */
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;border-radius:14px;padding:12px 24px;font-size:13px;font-weight:700;z-index:300;animation:slideUp .3s ease;box-shadow:0 8px 28px rgba(0,198,255,.4);white-space:nowrap;max-width:90vw;text-align:center}

/* Bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(10,15,30,.97);backdrop-filter:blur(28px);border-top:1px solid rgba(0,198,255,.09);display:flex;padding:9px 0 13px}
.nav-btn{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 2px;position:relative;transition:all .2s}
.nav-btn span.icon{font-size:22px;transition:all .25s}
.nav-btn span.lbl{font-size:9px;font-family:Tahoma,Arial,sans-serif;font-weight:500;transition:all .2s}
.nav-btn.active span.icon{filter:drop-shadow(0 0 6px var(--c1))}
.nav-btn.active span.lbl{color:var(--c1)}
.nav-btn:not(.active) span.icon{opacity:.3;filter:grayscale(1)}
.nav-btn:not(.active) span.lbl{color:var(--t3)}
.nav-indicator{position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:28px;height:2.5px;background:var(--g);border-radius:2px}

/* Header search */
.search-bar{flex:1;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border:1px solid rgba(0,198,255,.15);border-radius:28px;padding:9px 14px;transition:all .3s;max-width:480px}
.search-bar:focus-within{border-color:rgba(0,198,255,.38);background:rgba(0,198,255,.04);box-shadow:0 0 0 3px rgba(0,198,255,.06)}
.search-bar input{flex:1;background:transparent;border:none;outline:none;color:var(--t1);font-size:13px;font-family:Tahoma,Arial,sans-serif}
.search-bar .go{background:var(--g);border:none;border-radius:20px;padding:6px 14px;color:#fff;font-family:Tahoma,Arial,sans-serif;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0}
.search-bar .go:hover{transform:scale(1.04)}

/* Category grid */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.cat-btn{background:var(--s2);border:1px solid rgba(255,255,255,.06);border-radius:13px;padding:12px 6px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .25s}
.cat-btn:hover{transform:translateY(-3px);border-color:rgba(0,198,255,.3);background:rgba(0,198,255,.06)}
.cat-btn.active{border-color:rgba(0,198,255,.5);background:rgba(0,198,255,.1);box-shadow:0 0 14px rgba(0,198,255,.18)}
.cat-btn .ci{font-size:24px;line-height:1}
.cat-btn .cl{font-size:9px;color:var(--t2);line-height:1.3;font-family:Tahoma,Arial,sans-serif}

/* Shop card */
.shop-card{background:var(--s1);border:1px solid rgba(0,198,255,.1);border-radius:var(--rad);padding:16px;transition:all .3s;margin-bottom:10px}
.shop-card:hover{border-color:rgba(0,198,255,.25);transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,198,255,.08)}

/* Review card */
.rev-card{background:var(--s1);border:1px solid rgba(0,198,255,.08);border-radius:var(--rad);padding:15px;margin-bottom:10px}

/* Steps */
.steps{display:flex;gap:6px;margin-bottom:22px}
.step-bar{flex:1;height:3px;border-radius:2px;transition:all .4s}

/* Typing cursor */
.cursor{display:inline-block;animation:blink .7s step-end infinite;color:var(--c1);font-size:17px}

/* Gear SVG */
.gear-wrap{position:fixed;pointer-events:none;z-index:1}
</style>
</head>

];
const CITIES=["تهران","اصفهان","شیراز","مشهد","تبریز","کرج","اهواز","قم","رشت","کرمانشاه","همدان","ارومیه","زاهدان","بندرعباس","یزد","بوشهر","گرگان","اراک","سمنان","سایر"];
const SUGGS=["یخچالم برفک می‌زنه","گوشیم شارژ نمیگیره","ماشین لباسشویی آب نمیکشه","کولر سرد نمی‌کنه","لپ‌تاپم روشن نمیشه","تلویزیون تصویر نداره","پکیج آب گرم نمیده","اجاق گاز روشن نمیشه"];

];

  {amt:200000,lbl:"۲۰۰ هزار",ic:"🚀",desc:"حامی ویژه"},
  {amt:500000,lbl:"۵۰۰ هزار",ic:"💎",desc:"قهرمان"},
];

/* ═══ DB ═══ */
const db={
  g:k=>{try{return JSON.parse(localStorage.getItem(k));}catch{return null;}},
  s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}},
};

/* ═══ HOOKS ═══ */
function useTyping(text,spd=12){
  const [d,setD]=useState("");const [done,setDone]=useState(false);
  useEffect(()=>{
    if(!text){setD("");setDone(false);return;}
    setD("");setDone(false);let i=0;
    const t=setInterval(()=>{i++;setD(text.slice(0,i));if(i>=text.length){clearInterval(t);setDone(true);}},spd);
    return()=>clearInterval(t);
  },[text]);
  return{disp:d,done};
}

/* ═══ PARTICLES ═══ */
const Particles=()=>{
  const ref=useRef(null);
  useEffect(()=>{
    const c=ref.current;if(!c)return;
    const ctx=c.getContext("2d");
    let W=c.width=window.innerWidth,H=c.height=window.innerHeight;
    const resize=()=>{W=c.width=window.innerWidth;H=c.height=window.innerHeight;};
    window.addEventListener("resize",resize);
    const pts=Array.from({length:52},()=>({
      x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-.5)*.27,vy:(Math.random()-.5)*.27,
      r:Math.random()*1.5+.3,
      col:Math.random()>.5?"rgba(0,198,255,":"rgba(123,47,247,",
    }));
    let raf;
    const draw=()=>{
      ctx.clearRect(0,0,W,H);
      pts.forEach(p=>{
        p.x+=p.vx;p.y+=p.vy;
        if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=p.col+".22)";ctx.fill();
      });
      pts.forEach((a,i)=>pts.slice(i+1).forEach(b=>{
        const d=Math.hypot(a.x-b.x,a.y-b.y);
        if(d<125){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=`rgba(0,198,255,${.045*(1-d/125)})`;ctx.lineWidth=.6;ctx.stroke();}
      }));
      raf=requestAnimationFrame(draw);
    };
    draw();
    return()=>{cancelAnimationFrame(raf);window.removeEventListener("resize",resize);};
  },[]);
  return <canvas ref={ref} style={{position:"fixed",inset:0,zIndex:0,pointerEvents:"none"}}/>;
};

/* ═══ GEAR ═══ */
const Gear=({size=70,spd=16,op=.07,rev=false,col="#00c6ff"})=>{
  const n=12,r=size/2,ri=r*.65,rt=r*.85,pts=[];
  for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2,aw=Math.PI/n*.5;
    pts.push(`${rt*Math.cos(a-aw)},${rt*Math.sin(a-aw)}`);
    pts.push(`${r*Math.cos(a-aw*.3)},${r*Math.sin(a-aw*.3)}`);
    pts.push(`${r*Math.cos(a+aw*.3)},${r*Math.sin(a+aw*.3)}`);
    pts.push(`${rt*Math.cos(a+aw)},${rt*Math.sin(a+aw)}`);
  }
  return <svg width={size*2} height={size*2} viewBox={`${-size} ${-size} ${size*2} ${size*2}`}
    style={{animation:`${rev?"spinR":"spin"} ${spd}s linear infinite`,display:"block"}}>
    <polygon points={pts.join(" ")} fill="none" stroke={col} strokeWidth="1.5" opacity={op}/>
    <circle r={ri} fill="none" stroke={col} strokeWidth="1" opacity={op*.8}/>
    <circle r={r*.18} fill={col} opacity={op*.6}/>
  </svg>;
};

/* ═══ MAP ═══ */
const MapComp=({lat,lng,onPick,ro=false,markers=[]})=>{
  const ref=useRef(null),inst=useRef(null),mk=useRef(null);
  useEffect(()=>{
    if(!window.L||!ref.current)return;
    const L=window.L;
    if(inst.current){inst.current.remove();inst.current=null;}
    const map=L.map(ref.current).setView([lat||35.6892,lng||51.389],lat?14:10);
    inst.current=map;
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OSM"}).addTo(map);
    const mkIco=(c1,c2)=>L.divIcon({className:"",
      html:`<div style="width:26px;height:26px;background:linear-gradient(135deg,${c1},${c2});border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2.5px solid #fff;box-shadow:0 3px 10px ${c1}70"></div>`,
      iconSize:[26,26],iconAnchor:[13,26]});
    if(lat&&lng)mk.current=L.marker([lat,lng],{icon:mkIco("#00c6ff","#7b2ff7")}).addTo(map);
    markers.forEach(m=>L.marker([m.lat,m.lng],{icon:mkIco("#f97316","#ef4444")}).addTo(map)
      .bindPopup(`<b style="font-family:Tahoma">${m.name}</b><br/><small style="font-family:Tahoma">${m.city}</small>`));
    if(!ro)map.on("click",e=>{const{lat:la,lng:ln}=e.latlng;if(mk.current)map.removeLayer(mk.current);mk.current=L.marker([la,ln],{icon:mkIco("#00c6ff","#7b2ff7")}).addTo(map);onPick&&onPick(la,ln);});
    return()=>{inst.current&&inst.current.remove();inst.current=null;};
  },[lat,lng,ro,markers.length]);
  return <div ref={ref} style={{width:"100%",height:"100%",borderRadius:14}}/>;
};

const Stars=({n=5,sz=15,onChange})=>(

/* ═══ SEARCH BAR (header) ═══ */
const SearchBar=({onSearch})=>{
  const [q,setQ]=useState("");
  const go=()=>{if(q.trim())onSearch(q);};
  return (
    <div className="search-bar">
      <span style={{fontSize:16,flexShrink:0}}>🔍</span>
      <input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="مشکل دستگاهت رو بنویس..."/>
      <button className="go" onClick={go}>تشخیص ←</button>
    </div>
  );
};

              <div style={{textAlign:"center",padding:"80px 0",animation:"fadeIn .3s ease"}}>
                <div style={{position:"relative",width:120,height:120,margin:"0 auto 30px",display:"flex",alignItems:"center",justifyContent:"center"}}>
                  <div style={{position:"absolute",top:2,left:10}}><Gear size={46} spd={4} op={.65} col="#00c6ff"/></div>
                  <div style={{position:"absolute",bottom:2,right:10}}><Gear size={33} spd={2.8} op={.55} rev col="#7b2ff7"/></div>
                  <div style={{position:"absolute",top:10,right:2}}><Gear size={20} spd={5} op={.45} col="#10b981"/></div>
                  <div style={{width:22,height:22,borderRadius:"50%",background:"linear-gradient(135deg,#00c6ff,#7b2ff7)",boxShadow:"0 0 30px rgba(0,198,255,.9)",animation:"glow 1.5s ease-in-out infinite"}}/>
                </div>
                <div style={{fontSize:18,fontWeight:800,marginBottom:9}} className="gt">در حال تشخیص{".".repeat(dots)}</div>
                <div style={{color:"var(--t3)",fontSize:13,lineHeight:1.7}}>هوش مصنوعی مشکل رو بررسی می‌کنه</div>
              </div>
            )}

            {dPhase==="result"&&(
              <div style={{animation:"fadeUp .4s ease"}}>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
                  <button className="btn btn-ghost btn-sm" onClick={()=>{setDPhase("idle");setDResult("");setDq("");setSelCat(null);}}>← سوال جدید</button>
                  <div className="divider" style={{flex:1,margin:0}}/>
                  <span className="badge badge-green">پاسخ AI</span>
                </div>

                {selCat&&<div style={{background:`${selCat.c}0c`,border:`1px solid ${selCat.c}22`,borderRadius:11,padding:"8px 14px",marginBottom:12,display:"flex",gap:7,alignItems:"center",fontSize:13,color:selCat.c}}>
                  <span>{selCat.i}</span><span>{selCat.l}</span>
                </div>}

                <div className="card card-glow" style={{fontSize:13,lineHeight:2.1,color:"var(--t2)",whiteSpace:"pre-wrap",minHeight:200,padding:"22px",marginBottom:16,background:"rgba(0,198,255,.025)"}}>
                  {disp}{!done&&<span className="cursor">▌</span>}
                </div>

                {done&&(
                  <div className="card" style={{textAlign:"center",padding:"20px",background:"linear-gradient(135deg,rgba(0,198,255,.04),rgba(123,47,247,.04))",borderColor:"rgba(0,198,255,.14)"}}>
                    <div style={{fontSize:13,color:"var(--t3)",marginBottom:14}}>نزدیک‌ترین تعمیرگاه رو هم پیدا کن؟</div>
                    <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
                      <button className="btn btn-primary btn-sm" onClick={()=>setTab("find")}>📍 یافتن تعمیرگاه</button>
                      <button className="btn btn-ghost btn-sm" onClick={()=>setShowRev(true)}>💬 نظر بده</button>
                      <button className="btn btn-ghost btn-sm" onClick={()=>setShowTip(true)}>💛 حمایت</button>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        )}

        {/* ════════ FIND ════════ */}
        {tab==="find"&&(
          <div style={{animation:"fadeUp .4s ease"}}>
            <div style={{marginBottom:20}}>
              <h2 style={{fontSize:21,fontWeight:900,marginBottom:6}} className="gt">📍 یافتن تعمیرگاه</h2>
              <p style={{color:"var(--t3)",fontSize:13}}>نزدیک‌ترین تعمیرگاه رو پیدا کن</p>
            </div>

            <div className="card" style={{marginBottom:16,padding:16}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
                <Sel label="🏙️ شهر" value={fCity} onChange={setFCity} opts={CITIES}/>
                <Sel label="🔧 نوع خدمات" value={fCat} onChange={setFCat} opts={CATS.map(c=>`${c.i} ${c.l}`)}/>
              </div>
              <div style={{display:"flex",gap:9}}>
                <button className="btn btn-primary" style={{flex:1}} onClick={doFind}>🔍 جستجو</button>
                <button className="btn btn-ghost btn-sm" style={{whiteSpace:"nowrap",padding:"10px 16px"}} onClick={getLoc}>{locLoad?"...":"📡 موقعیت"}</button>
              </div>
              {uLat&&<div style={{fontSize:11,color:"#34d399",marginTop:10,textAlign:"center",background:"rgba(16,185,129,.06)",border:"1px solid rgba(16,185,129,.15)",borderRadius:9,padding:"7px"}}>✅ موقعیت دریافت شد — نتایج بر اساس فاصله مرتب می‌شن</div>}
            </div>

            {fRes===null&&shops.length===0&&(
              <div style={{textAlign:"center",padding:"60px 0"}}>
                <div style={{fontSize:54,marginBottom:14,animation:"float 3s ease-in-out infinite"}}>🏪</div>
                <div style={{fontSize:14,color:"var(--t2)",marginBottom:20}}>هنوز تعمیرگاهی ثبت نشده</div>
                <button className="btn btn-primary btn-sm" onClick={()=>setTab("reg")}>✏️ اولین ثبت‌نام</button>
              </div>
            )}

            {fRes!==null&&fRes.length===0&&(
              <div style={{textAlign:"center",padding:"60px 0"}}>
                <div style={{fontSize:54,marginBottom:14}}>😕</div>
                <div style={{color:"var(--t2)",fontSize:14}}>تعمیرگاهی با این مشخصات پیدا نشد</div>
              </div>
            )}

            {((fRes!==null&&fRes.length>0)||(fRes===null&&shops.length>0))&&(<>
              <div style={{height:240,borderRadius:16,overflow:"hidden",marginBottom:16,border:"1.5px solid rgba(0,198,255,.14)"}}>
                <MapComp lat={uLat||35.6892} lng={uLng||51.389} ro markers={(fRes||shops).filter(s=>s.lat&&s.lng).map(s=>({lat:s.lat,lng:s.lng,name:s.name,city:s.city}))}/>
              </div>
              <div style={{fontSize:12,color:"var(--c1)",marginBottom:12,fontWeight:600}}>{(fRes||shops).length} تعمیرگاه یافت شد</div>
              {(fRes||shops).map(s=>(
                <div key={s.id} className="shop-card">
                  <div style={{display:"flex",alignItems:"flex-start",gap:12}}>
                    <div style={{width:48,height:48,borderRadius:13,background:"linear-gradient(135deg,rgba(0,198,255,.12),rgba(123,47,247,.12))",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>🔧</div>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:5}}>
                        <span style={{fontSize:14,fontWeight:700,color:"var(--t1)"}}>{s.name}</span>
                        {s.km!=null&&<span className="badge badge-blue">{s.km<1?`${(s.km*1000).toFixed(0)}m`:`${s.km.toFixed(1)}km`}</span>}
                      </div>
                      {s.owner&&<div style={{fontSize:11,color:"var(--t3)",marginBottom:4}}>👤 {s.owner}</div>}
                      <div style={{fontSize:11,color:"var(--t3)",marginBottom:9}}>📍 {s.city}{s.addr?` — ${s.addr}`:""}</div>
                      <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:10}}>
                        {s.svcs.slice(0,5).map(sv=><span key={sv} className="tag" style={{fontSize:9,color:"var(--t3)",background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.07)",borderRadius:7,padding:"2px 7px"}}>{sv}</span>)}
                        {s.svcs.length>5&&<span style={{fontSize:10,color:"var(--c1)"}}>+{s.svcs.length-5}</span>}
                      </div>
                      {s.desc&&<div style={{fontSize:11,color:"var(--t3)",marginBottom:10,lineHeight:1.7,background:"rgba(255,255,255,.02)",borderRadius:9,padding:"7px 11px"}}>{s.desc}</div>}
                      <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
                        {s.phone&&<a href={`tel:${s.phone}`} style={{fontSize:11,color:"var(--c1)",background:"rgba(0,198,255,.07)",border:"1px solid rgba(0,198,255,.18)",borderRadius:9,padding:"6px 13px",fontWeight:700,display:"flex",alignItems:"center",gap:4}}>📞 {s.phone}</a>}
                        {s.tel&&<a href={`https://t.me/${s.tel}`} target="_blank" style={{fontSize:11,color:"#a78bfa",background:"rgba(123,47,247,.07)",border:"1px solid rgba(123,47,247,.18)",borderRadius:9,padding:"6px 11px",fontWeight:600}}>✈️ تلگرام</a>}
                        {s.insta&&<a href={`https://instagram.com/${s.insta}`} target="_blank" style={{fontSize:11,color:"#f472b6",background:"rgba(236,72,153,.07)",border:"1px solid rgba(236,72,153,.18)",borderRadius:9,padding:"6px 11px",fontWeight:600}}>📸 اینستا</a>}
                      </div>
                    </div>
                  </div>
                </div>
              ))}
            </>)}
          </div>
        )}

        {/* ════════ REGISTER ════════ */}
        {tab==="reg"&&(
          <div style={{animation:"fadeUp .4s ease"}}>
            <div style={{marginBottom:20}}>
              <h2 style={{fontSize:21,fontWeight:900,marginBottom:6}} className="gt">✏️ ثبت تعمیرگاه</h2>
              <p style={{color:"var(--t3)",fontSize:13}}>رایگان — در taamiryar.com دیده بشو</p>
            </div>

            {rStep===3?(
              <div style={{textAlign:"center",padding:"50px 20px",animation:"fadeUp .5s ease"}}>
                <div style={{fontSize:70,marginBottom:18,animation:"float 3s ease-in-out infinite"}}>🎉</div>
                <div style={{fontSize:22,fontWeight:900,marginBottom:8}} className="gt">ثبت شد!</div>
                <div style={{color:"var(--t2)",fontSize:14,marginBottom:26,lineHeight:2}}>
                  <strong style={{color:"var(--t1)"}}>{form.name}</strong><br/>در taamiryar.com ثبت شد
                </div>
                <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
                  <button className="btn btn-ghost btn-sm" onClick={()=>{setRStep(0);setForm({name:"",owner:"",phone:"",tel:"",insta:"",city:"",addr:"",svcs:[],lat:null,lng:null,desc:""});}}>ثبت دیگری</button>
                  <button className="btn btn-primary btn-sm" onClick={()=>setTab("find")}>مشاهده در نقشه</button>
                </div>
              </div>
            ):(
              <>
                <div className="steps">
                  {["اطلاعات","خدمات","موقعیت"].map((l,i)=>(
                    <div key={i} style={{flex:1}}>
                      <div className="step-bar" style={{background:i<=rStep?"linear-gradient(90deg,#00c6ff,#7b2ff7)":"rgba(0,198,255,.08)"}}/>
                      <div style={{fontSize:10,color:i===rStep?"var(--c1)":i<rStep?"var(--t3)":"#1e3a4a",marginTop:5,textAlign:"center",fontWeight:i===rStep?700:400}}>{l}</div>
                    </div>
                  ))}
                </div>

                {rStep===0&&<div className="card">
                  <Field label="🏪 نام تعمیرگاه *" value={form.name} onChange={ff("name")} ph="تعمیرگاه رضایی"/>
                  <Field label="👤 نام صاحب" value={form.owner} onChange={ff("owner")} ph="علی رضایی"/>
                  <Field label="📞 شماره تماس *" value={form.phone} onChange={ff("phone")} ph="09121234567" type="tel"/>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                    <Field label="✈️ تلگرام" value={form.tel} onChange={ff("tel")} ph="username"/>
                    <Field label="📸 اینستاگرام" value={form.insta} onChange={ff("insta")} ph="username"/>
                  </div>
                  <Sel label="🏙️ شهر *" value={form.city} onChange={ff("city")} opts={CITIES}/>
                  <Field label="📍 آدرس کامل" value={form.addr} onChange={ff("addr")} ph="خیابان، کوچه، پلاک..." multi/>
                  <button className="btn btn-primary btn-full" onClick={()=>{if(form.name&&form.phone&&form.city)setRStep(1);}} style={{opacity:!form.name||!form.phone||!form.city?.5:1}}>مرحله بعد ←</button>
                </div>}

                {rStep===1&&<div className="card">
                  <div style={{fontSize:14,fontWeight:700,color:"var(--t1)",marginBottom:14}}>🔧 خدمات ارائه شده *</div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8,marginBottom:16}}>
                    {CATS.map(c=>{const k=`${c.i} ${c.l}`;const sel=form.svcs.includes(k);return(
                      <button key={k} onClick={()=>togSvc(k)} style={{background:sel?`${c.c}12`:"rgba(255,255,255,.02)",border:`1.5px solid ${sel?`${c.c}44`:"rgba(255,255,255,.07)"}`,color:sel?c.c:"var(--t3)",borderRadius:11,padding:"10px 9px",fontFamily:"Tahoma,Arial,sans-serif",cursor:"pointer",transition:"all .2s",display:"flex",alignItems:"center",gap:7,fontSize:12,boxShadow:sel?`0 0 11px ${c.c}1e`:"none"}}>
                        <span style={{fontSize:18}}>{c.i}</span><span>{c.l}</span>
                      </button>
                    );})}
                  </div>
                  <Field label="📝 توضیحات بیشتر" value={form.desc} onChange={ff("desc")} ph="سابقه کار، گارانتی، خدمات ویژه..." multi/>
                  <div style={{display:"flex",gap:10}}>
                    <button className="btn btn-ghost btn-sm" onClick={()=>setRStep(0)}>→ قبلی</button>
                    <button className="btn btn-primary" style={{flex:1}} onClick={()=>{if(form.svcs.length>0)setRStep(2);}} style={{opacity:!form.svcs.length?.5:1,flex:1,}} className="btn btn-primary">مرحله بعد ←</button>
                  </div>
                </div>}

                {rStep===2&&<div className="card">
                  <div style={{fontSize:14,fontWeight:700,color:"var(--t1)",marginBottom:7}}>🗺️ موقعیت روی نقشه</div>
                  <div style={{fontSize:12,color:"var(--t3)",marginBottom:13,lineHeight:1.7}}>روی نقشه کلیک کن تا موقعیت دقیق مشخص بشه (اختیاری)</div>
                  <div style={{height:270,borderRadius:14,overflow:"hidden",marginBottom:13,border:"1.5px solid rgba(0,198,255,.14)"}}>
                    <MapComp lat={form.lat||35.6892} lng={form.lng||51.389} onPick={(la,ln)=>setForm(p=>({...p,lat:la,lng:ln}))}/>
                  </div>
                  {form.lat&&<div style={{fontSize:11,color:"#34d399",marginBottom:13,textAlign:"center",background:"rgba(16,185,129,.06)",border:"1px solid rgba(16,185,129,.18)",borderRadius:9,padding:"8px"}}>✅ موقعیت انتخاب شد</div>}
                  <div style={{background:"rgba(249,115,22,.05)",border:"1px solid rgba(249,115,22,.14)",borderRadius:11,padding:"12px 14px",marginBottom:13,fontSize:11,color:"#9a4a00",lineHeight:1.8}}>
                    💳 <strong style={{color:"#c2621c"}}>درگاه پرداخت ریالی:</strong> به زودی از طریق زرین‌پال فعال می‌شه.
                  </div>
                  <div style={{display:"flex",gap:10}}>
                    <button className="btn btn-ghost btn-sm" onClick={()=>setRStep(1)}>→ قبلی</button>
                    <button className="btn btn-primary" style={{flex:1}} onClick={submitShop} disabled={saving}>{saving?"در حال ثبت...":"✅ ثبت رایگان تعمیرگاه"}</button>
                  </div>
                </div>}
              </>
            )}
          </div>
        )}
      </main>

      {/* ═══ REVIEW MODAL ═══ */}
      {showRev&&(
        <div className="overlay" onClick={()=>setShowRev(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div style={{fontSize:28,textAlign:"center",marginBottom:12}}>💬</div>
            <div style={{fontSize:17,fontWeight:900,textAlign:"center",marginBottom:20}} className="gt">نظرت رو بنویس</div>
            <Field label="نام شما *" value={revF.name} onChange={v=>setRevF(p=>({...p,name:v}))} ph="علی محمدی"/>
            <Sel label="شهر" value={revF.city} onChange={v=>setRevF(p=>({...p,city:v}))} opts={CITIES}/>
            <div className="field">
              <label className="label">امتیاز</label>
              <Stars n={revF.rating} sz={26} onChange={n=>setRevF(p=>({...p,rating:n}))}/>
            </div>
            <Field label="نظر *" value={revF.text} onChange={v=>setRevF(p=>({...p,text:v}))} ph="تجربه‌ات رو بنویس..." multi/>
            <div style={{display:"flex",gap:10}}>
              <button className="btn btn-primary" style={{flex:1}} onClick={submitRev} disabled={!revF.name||!revF.text}>ثبت نظر</button>
              <button className="btn btn-ghost" style={{padding:"12px 16px"}} onClick={()=>setShowRev(false)}>✕</button>
            </div>
          </div>
        </div>
      )}

      {/* ═══ TIP MODAL (ریالی) ═══ */}
      {showTip&&(
        <div className="overlay" onClick={()=>setShowTip(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()} style={{position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",top:-60,left:"50%",transform:"translateX(-50%)",width:240,height:120,background:"radial-gradient(ellipse,rgba(0,198,255,.1) 0%,transparent 70%)",pointerEvents:"none"}}/>
            <div style={{fontSize:38,textAlign:"center",marginBottom:12}}>💛</div>
            <div style={{fontSize:19,fontWeight:900,textAlign:"center",marginBottom:8}} className="gt">حمایت مالی</div>
            <div style={{color:"var(--t3)",fontSize:12,textAlign:"center",marginBottom:22,lineHeight:1.9}}>
              تعمیریار رایگانه.<br/>با حمایتت بهترش کن 🙏
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:18}}>
              {TIPS.map(t=>(
                <button key={t.amt} onClick={()=>setTipSel(tipSel?.amt===t.amt?null:t)}
                  style={{background:tipSel?.amt===t.amt?"linear-gradient(135deg,rgba(0,198,255,.15),rgba(123,47,247,.15))":"rgba(255,255,255,.03)",border:`1.5px solid ${tipSel?.amt===t.amt?"rgba(0,198,255,.45)":"rgba(255,255,255,.06)"}`,color:tipSel?.amt===t.amt?"var(--c1)":"var(--t3)",borderRadius:15,padding:"14px 8px",fontFamily:"Tahoma,Arial,sans-serif",cursor:"pointer",transition:"all .2s",boxShadow:tipSel?.amt===t.amt?"0 0 18px rgba(0,198,255,.2)":"none"}}>
                  <div style={{fontSize:22,marginBottom:5}}>{t.ic}</div>
                  <div style={{fontSize:14,fontWeight:800}}>{t.lbl} تومان</div>
                  <div style={{fontSize:9,opacity:.6,marginTop:3}}>{t.desc}</div>
                </button>
              ))}
            </div>
            <div style={{background:"rgba(249,115,22,.05)",border:"1px solid rgba(249,115,22,.13)",borderRadius:11,padding:"11px",marginBottom:16,fontSize:11,color:"#9a4a00",lineHeight:1.7,textAlign:"center"}}>
              💳 درگاه پرداخت ریالی — زرین‌پال<br/>
              <span style={{color:"#c2621c"}}>به زودی فعال می‌شه</span>
            </div>
            <div style={{display:"flex",gap:10}}>
              <button className="btn btn-primary" style={{flex:1,opacity:tipSel?1:.5,cursor:tipSel?"pointer":"default"}}
                onClick={()=>{if(tipSel){setToast(`💛 ممنون! ${tipSel.lbl} تومان ثبت شد`);setShowTip(false);setTipSel(null);}}}>
                {tipSel?`💛 ${tipSel.lbl} تومان حمایت`:"مبلغ رو انتخاب کن"}
              </button>
              <button className="btn btn-ghost" style={{padding:"12px 14px"}} onClick={()=>setShowTip(false)}>✕</button>
            </div>
          </div>
        </div>
      )}

      {toast&&<div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
